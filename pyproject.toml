[tool.poetry]
name = "satnogs-telemetry"
version = "1.0.0"
description = "Headless SatNOGS telemetry downloader, decoder, SQLite store, plotter, and CSV exporter"
authors = ["Aldo Aguilar <aldo.aguilar@berkeley.edu>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "satnogs_telemetry", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
requests = ">=2.32,<3.0"
matplotlib = ">=3.8,<4.0"
tomli-w = "^1.2.0"
python-dotenv = "^1.2.2"

[tool.poetry.scripts]
satnogs-telemetry = "satnogs_telemetry.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
